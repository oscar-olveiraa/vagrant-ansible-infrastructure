- name: Crear directorios
  file:
    path: /opt/web/{{ item }}
    state: directory
  loop:
    - html

- name: Copiar index.html
  copy:
    dest: /opt/web/html/index.html
    content: |
      <h1>Infra automatizada</h1>
      <p>Desplegada con Vagrant + Ansible + Docker</p>

- name: Copiar docker-compose
  copy:
    src: docker-compose.yml
    dest: /opt/web/docker-compose.yml

- name: Levantar servicio web
  command: docker-compose up -d
  args:
    chdir: /opt/web
